name: Publish npm

# After first manual publish + Trusted Publisher on npmjs.com, CI publishes via OIDC
# (no NPM_TOKEN). See docs/publishing.md

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only (do not publish)"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use recent npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG) must match release tag version ($VERSION)."
            exit 1
          fi

      # Prefer OIDC Trusted Publishing. Optional fallback: repo secret NPM_TOKEN.
      - name: Publish
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run pack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm pack
