name: Publish npm

# Publishes mxpf-ai-harness when a GitHub Release is published.
# Prerequisite: repo secret NPM_TOKEN (npm Automation token for sreekuttan.m.achari)
# See docs/publishing.md

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # reserved for future npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # refs/tags/v0.1.0 → v0.1.0; release may use tag name
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG) must match release tag version ($VERSION). Bump package.json before tagging."
            exit 1
          fi

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
